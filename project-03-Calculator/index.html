<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Calculator</h2>
        <input type="number" class="input-calc" value="0" readonly>

        <div class="all-Btn">

          
                <button class="ac-Btn" >AC</button>
                <button class="divide-Btn">÷</button>
                <button class="multiplication-Btn">X</button>
                <button class="substraction-Btn">-</button>
                
                <button class="seven">7</button>
                <button class="eight">8</button>
                <button class="nine">9</button>

                <button class="addition-Btn">+</button>

                <button class="four">4</button>
                <button class="five">5</button>
                <button class="six">6</button>
                <button class="per-Btn">%</button>

            <button class="one">1</button>
            <button class="two">2</button>
            <button class="three">3</button>
            <button class="equal-Btn">=</button>
            <button class="zero">0</button>

            <button class="dot-Btn">.</button>
      

        
</div>
        
    </div>


</body>
</html>

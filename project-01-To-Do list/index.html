<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-do List</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #a6c8eb;
      color: #1d2b2a;
    }

    .app {
      width: 100%;
      max-width: 480px;
    }

    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    #count { margin: 0 0 20px; color: #5b6e6c; font-size: 0.95rem; }

    .add-row { display: flex; gap: 8px; }

    #taskInput {
      flex: 1;
      padding: 12px 14px;
      font-size: 1rem;
      border: 2px solid #c5d3d1;
      border-radius: 8px;
      background: #fff;
    }
    #taskInput:focus { outline: none; border-color: #0f766e; }

    button {
      cursor: pointer;
      font: inherit;
      border: none;
      border-radius: 8px;
    }

    #addBtn {
      padding: 0 18px;
      background: #0066a8;
      color: #e9eae8;
      font-weight: 600;
    }
    #addBtn:hover { background: #0057a8; }

    .filters { display: flex; gap: 6px; margin: 16px 0; }
    .filters button {
      padding: 6px 14px;
      background: #dde7e5;
      color: #1d2b2a;
    }
    .filters button.active { background: #1d2b2a; color: #fff; }

    ul { list-style: none; margin: 0; padding: 0; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: #fff;
      border-radius: 8px;
    }

    li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: #8a9a98; }

    .delete {
      background: none;
      color: #b42318;
      font-size: 1.1rem;
      padding: 2px 8px;
    }
    .delete:hover { background: #fde8e6; }

    .empty { text-align: center; color: #5b6e6c; padding: 24px 0; }
  </style>
</head>
<body>
  <div class="app">
    <h1>To-do list</h1>
    <p id="count"></p>

    <div class="add-row">
      <input id="taskInput" type="text" placeholder="What needs doing?" autocomplete="off" />
      <button id="addBtn">Add task</button>
    </div>

    <div class="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </div>

    <ul id="list"></ul>
  </div>

  <script>
    // state 
    // each task looks like: { id: 123, text: "Learn React", done: false}
    let tasks = loadTasks();
    let currentFilter = "all";

    //  grab elements 
    const input = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const list = document.getElementById("list");
    const count = document.getElementById("count");
    const filterButtons = document.querySelectorAll(".filters button");

    //  save / load (localStorage keeps tasks after refresh) 
    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem("tasks")) || [];
      } catch {
        return [];
      }
    }

    //  actions 
    function addTask() {
      const text = input.value.trim();
      if (text === "") return; //ignore empty input

      tasks.push({ id: Date.now(), text: text, done: false });
      input.value = "";
      saveTasks();
      render();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      task.done = !task.done;
      saveTasks();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      render();
    }

    //  Draw the list on screen 
    function render() {
      // 1. Pick which tasks to show based on the filter
      const visible = tasks.filter(t => {
        if (currentFilter === "active") return !t.done;
        if (currentFilter === "done") return t.done;
        return true;
      });

      // 2. clear the list,then rebuild it
      list.innerHTML = "";

      if (visible.length === 0) {
        list.innerHTML = '<p class="empty">Nothing here. Add a task above.</p>';
      }

      visible.forEach(task => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const label = document.createElement("span");
        label.textContent = task.text; // textContent is safe (no HTML injection)

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "✕";
        del.setAttribute("aria-label", "Delete task");
        del.addEventListener("click", () => deleteTask(task.id));

        li.append(checkbox, label, del);
        list.appendChild(li);
      });

      // 3. update the "x tasks left" text
      const left = tasks.filter(t => !t.done).length;
      count.textContent = left + (left === 1 ? " task left" : " tasks left");
    }

    // Events
    addBtn.addEventListener("click", addTask);

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") addTask();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        currentFilter = btn.dataset.filter;
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render();
      });
    });

    //  First draw 
    render();
  </script>
</body>
</html>
